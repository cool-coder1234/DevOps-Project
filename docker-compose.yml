version: '3.8'
services:
  frontend:
    build: ./frontend-js
    ports:
      - "3000:80"
    environment:
      - API_URL=http://localhost:5000
    depends_on:
      - backend

  backend:
    build: ./backend-dotnet/SimpleAPI
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - redis

  worker:
    build: ./worker-python
    environment:
      - REDIS_HOST=redis
      - SERVER_NAME=localhost
      - FLASK_APP=flasky.py
      - FLASK_ENV=development
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"